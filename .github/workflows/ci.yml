# CI — build the server and run the protocol regression tests against it.
#
# There is no dependency graph, no lockfile and no package manager: the whole
# build is one swiftc invocation, so this workflow is short on purpose. It is the
# gate that makes the rest of the plan safe to work on — every later change to
# chatbox.swift lands against tests/protocol.sh.
name: CI

# Actions are pinned to a commit SHA, never to a moving tag: a tag can be repointed at any time by
# whoever controls the action, and this workflow runs on a runner that holds the repository's token.
# The release the SHA was taken from is in the trailing comment. To update one:
#   gh api repos/actions/checkout/git/ref/tags/v7 --jq .object.sha   # (dereference if it is a tag object)
# then replace the SHA and the comment together, and let the workflow run once before merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + protocol tests
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: xcrun swiftc --version

      # The documented build, unchanged: if this breaks, the README is wrong.
      - name: Build
        run: |
          xcrun swiftc -O chatbox.swift -o chatbox
          xcrun swiftc -O chatbox-mcp.swift -o chatbox-mcp

      # The audit standard, which the documented build above does not enforce: Swift 6 language mode,
      # complete concurrency checking, warnings as errors. `-O` alone builds a non-Sendable capture or
      # a shared mutable global with a warning at most, so without this step a concurrency regression
      # passes every job in this workflow - including the protocol tests, which never compile the
      # sources. It is a separate step so the failure says which standard was broken.
      - name: Strict concurrency, warnings as errors
        run: |
          xcrun swiftc -O -swift-version 6 -strict-concurrency=complete -warnings-as-errors -typecheck chatbox.swift
          xcrun swiftc -O -swift-version 6 -strict-concurrency=complete -warnings-as-errors -typecheck chatbox-mcp.swift

      # The committed formatter and linter configs, run with --strict so a style regression fails
      # the build instead of becoming a review comment. swift-format ships with the toolchain;
      # SwiftLint is installed only if the runner image does not already carry it.
      - name: Format and lint
        run: |
          set -eu
          xcrun swift-format lint --strict --configuration .swift-format chatbox.swift chatbox-mcp.swift
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi
          swiftlint version
          swiftlint lint --strict --config .swiftlint.yml chatbox.swift chatbox-mcp.swift

      - name: Start a disposable server
        run: |
          set -eu
          mkdir -p tests/.scratch
          openssl rand -hex 24 > tests/.scratch/token
          chmod 600 tests/.scratch/token
          nohup ./chatbox --port 8787 --db tests/.scratch/ci.sqlite \
            --token-file tests/.scratch/token > tests/.scratch/server.log 2>&1 < /dev/null &
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:8787/health?token=$(cat tests/.scratch/token)" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:8787/health?token=$(cat tests/.scratch/token)"

      - name: Protocol regression tests
        env:
          CHATBOX_URL: http://127.0.0.1:8787
          # Lets the suite pin the server-side wait cap and the behaviour of a
          # client that abandons a long poll, both of which are only observable
          # in the server's log.
          CHATBOX_SERVER_LOG: tests/.scratch/server.log
          # Lets the suite assert that issued credential secrets are stored only as
          # a hash, which is not observable over HTTP.
          CHATBOX_DB: tests/.scratch/ci.sqlite
          # The suite starts its own short-staleness server for the presence-timing
          # checks, which a seven-day window cannot exercise.
          CHATBOX_BIN: ${{ github.workspace }}/chatbox
          # The MCP adapter is a separate binary; the suite drives it over stdio.
          CHATBOX_MCP: ${{ github.workspace }}/chatbox-mcp
        run: |
          set -eu
          CHATBOX_TOKEN="$(cat tests/.scratch/token)" sh tests/protocol.sh

      - name: Backups — a verified copy, and the copies that are not one
        run: |
          set -eu
          # The documented procedure, end to end, against the board the suite just wrote to.
          rm -f tests/.scratch/backup.sqlite
          ./chatbox --db tests/.scratch/ci.sqlite --backup tests/.scratch/backup.sqlite
          ./chatbox --db tests/.scratch/ci.sqlite --verify-backup tests/.scratch/backup.sqlite
          # What the incident left behind: an empty file, and a valid database with no tables.
          : > tests/.scratch/zero.sqlite
          if ./chatbox --verify-backup tests/.scratch/zero.sqlite 2>/dev/null; then
            echo "::error::an empty file passed as a backup"; exit 1
          fi
          sqlite3 tests/.scratch/notables.sqlite "PRAGMA user_version=0;"
          if ./chatbox --verify-backup tests/.scratch/notables.sqlite 2>/dev/null; then
            echo "::error::an empty 4 KB database passed as a backup"; exit 1
          fi
          # A copy that is a valid board but older than the one it names. Only the comparison
          # can see this, which is why --backup always makes one.
          sqlite3 tests/.scratch/backup.sqlite "DELETE FROM messages;"
          if ./chatbox --db tests/.scratch/ci.sqlite --verify-backup tests/.scratch/backup.sqlite 2>/dev/null; then
            echo "::error::a stale copy passed verification"; exit 1
          fi
          # And it is never silently replaced.
          if ./chatbox --db tests/.scratch/ci.sqlite --backup tests/.scratch/backup.sqlite 2>/dev/null; then
            echo "::error::an existing backup was overwritten"; exit 1
          fi

      - name: Server log
        if: always()
        run: cat tests/.scratch/server.log || true
