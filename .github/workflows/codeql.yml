# CodeQL code scanning — advanced setup.
#
# Why this file exists instead of GitHub's default setup: CodeQL for Swift
# supports only `autobuild` and `manual` (there is no `none` mode, because the
# extractor needs to see a real compilation). Default setup therefore ran
# `swift build`, found no Package.swift or Xcode project, and failed with
# "Autobuild failure" — analysing nothing while showing a red X on every push.
# See: https://github.com/Pummelchen/AISessionServer/actions/runs/34761830403
#
# Advanced setup lets us hand the extractor the project's actual, documented
# build command. Swift extraction is macOS-only.
name: CodeQL

# Same pinning rule as ci.yml: a commit SHA with the release in the comment, never a moving tag. The
# extraction step builds the same sources CI builds — both Swift binaries — so a finding in either is
# reportable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

# Let a running scan finish. A Swift analysis takes several minutes on a macOS
# runner, and with cancel-in-progress a burst of pushes supersedes every scan
# before it completes — a security check that never finishes reports nothing.
# Keeping only the newest *pending* run is the useful half of the behaviour.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze swift
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: swift
          # No Package.swift here by design, so autobuild has nothing to find.
          build-mode: manual

      # The build must really happen: this is what the extractor observes. It is
      # the same commands CI and the README use, so the analysed binaries are the
      # shipped binaries — both of them. Compiling only `chatbox.swift` left the MCP
      # adapter (which parses untrusted JSON from a host's stdin and builds the URL that
      # carries a credential) out of the database entirely, so a finding there could never
      # be reported while "CodeQL green" was read as covering the product.
      - name: Build for extraction
        run: |
          xcrun swiftc -O chatbox.swift -o chatbox
          xcrun swiftc -O chatbox-mcp.swift -o chatbox-mcp

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:swift"
