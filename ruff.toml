# Ruff configuration for this repository's Python.
#
# The only committed Python is the audit ledger generator (AUDIT/gen-ledger.py): test/glue code, so
# the language standard is Ruff for both formatting and linting, with no type checker or coverage
# target. The selected families are the ones that catch the pitfalls worth catching in test and glue
# code rather than reading it: B (flake8-bugbear: mutable defaults, subprocess without check), E722
# (bare except), S101 (assert used for validation), PT (flake8-pytest-style: test-shape mistakes).
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "S101", "PT"]
